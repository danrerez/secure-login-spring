<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{__${theme.layout}__}">
<head>
    <title>Criar conta</title>
</head>
<body>
<section layout:fragment="content" class="auth">
    <div class="card auth__card">
        <h1>Criar conta</h1>
        <p class="muted">Novas contas recebem o perfil <strong>Usuário</strong>.</p>

        <form th:action="@{/register}" th:object="${form}" method="post" class="form" novalidate>
            <div class="field" th:classappend="${#fields.hasErrors('name')} ? 'field--invalid'">
                <label for="name">Nome</label>
                <input type="text" th:field="*{name}" autocomplete="name" maxlength="80" required>
                <p th:replace="~{fragments/alerts :: fieldError('name')}"></p>
            </div>
            <div class="field" th:classappend="${#fields.hasErrors('email')} ? 'field--invalid'">
                <label for="email">E-mail</label>
                <input type="email" th:field="*{email}" autocomplete="email" maxlength="120" required>
                <p th:replace="~{fragments/alerts :: fieldError('email')}"></p>
            </div>
            <div class="field" th:classappend="${#fields.hasErrors('password')} ? 'field--invalid'">
                <label for="password">Senha</label>
                <div class="password">
                    <input type="password" th:field="*{password}" autocomplete="new-password" maxlength="64" required>
                    <button type="button" class="password__toggle" data-toggle-password="password"
                            aria-label="Mostrar senha">Mostrar</button>
                </div>
                <p class="field__hint">Mínimo de 8 caracteres, com maiúscula, minúscula, número e símbolo.</p>
                <p th:replace="~{fragments/alerts :: fieldError('password')}"></p>
            </div>
            <div class="field" th:classappend="${#fields.hasErrors('confirmPassword')} ? 'field--invalid'">
                <label for="confirmPassword">Confirmar senha</label>
                <input type="password" th:field="*{confirmPassword}" autocomplete="new-password" maxlength="64" required>
                <p th:replace="~{fragments/alerts :: fieldError('confirmPassword')}"></p>
            </div>
            <button type="submit" class="btn btn--primary btn--block">Cadastrar</button>
        </form>

        <p class="auth__switch">Já tem conta? <a th:href="@{/login}">Entrar</a></p>
    </div>
</section>
</body>
</html>
